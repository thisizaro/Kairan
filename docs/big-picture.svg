<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagram: admins sign a policy, the cloud distributes it, gateways inside each customer network verify and enforce it; tool calls and data stay inside the customer network.">
  <rect width="1600" height="900" fill="#ffffff"/><defs><style>
  svg { --ink:#1d2433; --muted:#5b6475; --line:#c9cfdb; --data:#2563eb; --policy:#d97706; --kairan:#15803d; --bg:#ffffff; --panel:#f6f7fa; }
  
  
  
  text { fill:var(--ink); }
  .t { font-size:30px; font-weight:700; }
  .h { font-size:21px; font-weight:700; }
  .s { font-size:17px; fill:var(--muted); }
  .b { font-size:18px; }
  .jp { font-size:16px; fill:var(--muted); }
  .box { fill:var(--panel); stroke:var(--line); stroke-width:2; rx:14; }
  .net { fill:none; stroke:#94a3b8; stroke-width:2.5; stroke-dasharray:10 7; rx:20; }
  .gate { fill:#fff7ed; stroke:var(--policy); stroke-width:3; rx:14; }
  .cloud { fill:#eef2ff; stroke:#6366f1; stroke-width:2; rx:20; }
  .k { fill:#ecfdf5; stroke:var(--kairan); stroke-width:2; rx:10; }
  .tool { fill:#ffffff; stroke:var(--line); stroke-width:2; rx:10; }
</style>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aPol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>

  <text x="40" y="50" class="t">Where Kairan fits　<tspan class="h" style="fill:#5b6475">Kairan の位置づけ</tspan></text>

  <!-- Admins -->
  <rect x="40" y="80" width="430" height="190" class="box"/>
  <text x="62" y="114" class="h">Security admins A + B</text>
  <text x="62" y="138" class="jp">セキュリティ管理者 A・B（お客様側）</text>
  <rect x="62" y="156" width="386" height="96" class="k"/>
  <text x="80" y="186" class="b">kairanctl: A signs, B approves</text>
  <text x="80" y="210" class="jp">A が署名、B が承認（稟議と同じ考え方）</text>
  <text x="80" y="236" class="s">Signing keys never leave their laptops</text>

  <!-- Cloud -->
  <rect x="540" y="70" width="1020" height="210" class="cloud"/>
  <text x="566" y="104" class="h">Cloud（クラウド）: manages, never sees data</text>
  <rect x="566" y="120" width="610" height="140" class="k"/>
  <text x="586" y="150" class="h">Control plane　<tspan class="jp">管理（コントロールプレーン）</tspan></text>
  <text x="586" y="178" class="b">· stores signed policies (cannot make or change one)</text>
  <text x="586" y="204" class="b">· rollout: canary first, then all　<tspan class="jp">段階的に配布</tspan></text>
  <text x="586" y="230" class="b">· fleet view: which gateway has which version</text>
  <rect x="1200" y="120" width="336" height="140" class="tool"/>
  <text x="1220" y="152" class="h">Fleet page</text>
  <text x="1220" y="176" class="jp">管理画面</text>
  <text x="1220" y="204" class="b">health · version · drift</text>
  <text x="1220" y="230" class="b">why an update was rejected</text>

  <!-- admin -> cloud -->
  <line x1="470" y1="200" x2="562" y2="200" stroke="#15803d" stroke-width="4" marker-end="url(#aK)"/>
  <text x="474" y="186" class="s">signed v2</text>

  <!-- firewall label -->
  <text x="1150" y="318" class="s">Firewall: gateways only connect out（外向き通信のみ）</text>

  <!-- Customer network bank-a -->
  <rect x="30" y="330" width="1540" height="420" class="net"/>
  <text x="52" y="366" class="h">Customer network: bank-a　<tspan class="jp">お客様の社内ネットワーク（銀行 A）</tspan></text>

  <!-- agents -->
  <rect x="60" y="420" width="320" height="210" class="box"/>
  <text x="80" y="456" class="h">Employees + AI agents</text>
  <text x="80" y="480" class="jp">社員・AIエージェント</text>
  <text x="80" y="516" class="b">Claude, ChatGPT,</text>
  <text x="80" y="542" class="b">in-house agents</text>
  <text x="80" y="580" class="s">Each agent has a role:</text>
  <text x="80" y="604" class="s">sales, intern, ...</text>

  <!-- gateway -->
  <rect x="490" y="390" width="480" height="270" class="gate"/>
  <text x="512" y="424" class="h">MCP gateway　<tspan class="jp">ゲートウェイ（フィルター）</tspan></text>
  <text x="512" y="448" class="s">an MCP gateway such as Tumiki · kairan-proxy in this demo</text>
  <text x="512" y="486" class="b">① Who is calling? key → role</text>
  <text x="512" y="516" class="b">② Is this tool allowed? policy: R / W / X</text>
  <text x="512" y="546" class="b">③ a full gateway also does: PII masking, audit, OAuth</text>
  <rect x="508" y="562" width="444" height="84" class="k"/>
  <text x="524" y="590" class="b">Kairan: verifies 2 signatures itself;</text>
  <text x="524" y="614" class="b">cloud down → keeps last good policy;</text>
  <text x="524" y="638" class="b">file tampered → blocks everything</text>

  <!-- logs -->
  <rect x="490" y="672" width="480" height="62" class="box"/>
  <text x="508" y="698" class="b">Local logs: every decision, every policy change</text>
  <text x="508" y="722" class="jp">ログは社内に保存（改ざんを検知できる形）</text>

  <!-- MCP servers -->
  <rect x="1080" y="400" width="460" height="250" class="box"/>
  <text x="1100" y="434" class="h">MCP servers　<tspan class="jp">社内システム</tspan></text>
  <rect x="1100" y="456" width="200" height="74" class="tool"/><text x="1120" y="500" class="b">CRM</text>
  <rect x="1320" y="456" width="200" height="74" class="tool"/><text x="1340" y="500" class="b">Notes</text>
  <rect x="1100" y="550" width="200" height="74" class="tool"/><text x="1120" y="594" class="b">GitHub</text>
  <rect x="1320" y="550" width="200" height="74" class="tool"/><text x="1340" y="594" class="b">Database</text>

  <!-- data flow -->
  <line x1="380" y1="525" x2="486" y2="525" stroke="#2563eb" stroke-width="5" marker-end="url(#aData)"/>
  <text x="392" y="512" class="s">tool call</text>
  <line x1="970" y1="525" x2="1076" y2="525" stroke="#2563eb" stroke-width="5" marker-end="url(#aData)"/>
  <text x="976" y="512" class="s">allowed</text>
  <text x="976" y="550" class="s">only</text>

  <!-- policy flow cloud <-> gateway -->
  <line x1="700" y1="262" x2="700" y2="386" stroke="#d97706" stroke-width="4" marker-end="url(#aPol)"/>
  <text x="560" y="300" class="s">signed policy ↓</text>
  <line x1="800" y1="388" x2="800" y2="264" stroke="#d97706" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#aPol)"/>
  <text x="812" y="300" class="s">↑ "anything newer?" + status</text>
  <text x="812" y="322" class="s">(versions, counts, error codes only)</text>

  <!-- city-b -->
  <rect x="30" y="768" width="1540" height="56" class="net"/>
  <text x="52" y="803" class="b">Customer network: city-b（市役所 B）: same setup, its own gateways and its own policy</text>

  <!-- legend -->
  <line x1="40" y1="862" x2="90" y2="862" stroke="#2563eb" stroke-width="5"/>
  <text x="100" y="868" class="b">Tool calls and data: stay inside　<tspan class="jp">データは社内に</tspan></text>
  <line x1="560" y1="862" x2="610" y2="862" stroke="#d97706" stroke-width="4"/>
  <text x="620" y="868" class="b">Policy and status only　<tspan class="jp">管理はクラウドで</tspan></text>
  <rect x="1060" y="848" width="40" height="26" class="k"/>
  <text x="1110" y="868" class="b">What Kairan adds　<tspan class="jp">Kairan が加える部分</tspan></text>
</svg>
