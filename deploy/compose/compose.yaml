# Kairan compose demo (Q-01): 10 REAL kairan-proxy containers, 2 tenants (bank-a: canary + 5 main,
# city-b: canary + 3 main), one fakemcp per tenant, kairan-cp, Prometheus, Grafana.
# Nothing here is simulated. Everything under ./.run (keys, tokens, configs) is generated by demo.sh at
# demo time and is gitignored. Use demo.sh; do not run this file by hand.
#
# Networks: "cloud" (control plane side) and one per customer ("bank-a", "city-b"). Each proxy sits on its
# customer network and on "cloud" (outbound to the control plane only). Prometheus joins all three: one
# Prometheus scraping every tenant network is a demo shortcut (ARCHITECTURE section 1).
# Chaos tests cut a proxy off with "docker network disconnect kairan-demo_cloud <container>".
name: kairan-demo

x-hardened: &hardened
  image: kairan:demo
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"          # chaos tests stop, kill and start containers themselves

x-proxy: &proxy
  <<: *hardened
  command: ["kairan-proxy", "-config", "/etc/kairan/proxy.json"]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/metrics"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  cp:
    <<: *hardened
    container_name: kairan-cp
    hostname: cp
    command: ["kairan-cp", "-config", "/etc/kairan/cp.json"]
    env_file: ./.run/cp.env               # KCP_ADMIN_TOKEN, generated at demo time
    volumes:
      - cp-data:/data
      - ./.run/cp.json:/etc/kairan/cp.json:ro
    networks: [cloud]
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:19100:9100"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 2s
      timeout: 2s
      retries: 30


  fakemcp-bank-a:
    <<: *hardened
    container_name: kairan-fakemcp-bank-a
    hostname: fakemcp-bank-a
    command: ["fakemcp", "-addr", "0.0.0.0:9000"]
    networks: [bank-a]


  fakemcp-city-b:
    <<: *hardened
    container_name: kairan-fakemcp-city-b
    hostname: fakemcp-city-b
    command: ["fakemcp", "-addr", "0.0.0.0:9000"]
    networks: [city-b]


  bank-a-canary:
    <<: *proxy
    container_name: kairan-bank-a-canary
    hostname: bank-a-canary
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-canary-data:/data
      - ./.run/proxies/bank-a-canary.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18101:8080", "127.0.0.1:19101:9090"]


  bank-a-main-1:
    <<: *proxy
    container_name: kairan-bank-a-main-1
    hostname: bank-a-main-1
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-main-1-data:/data
      - ./.run/proxies/bank-a-main-1.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18102:8080", "127.0.0.1:19102:9090"]


  bank-a-main-2:
    <<: *proxy
    container_name: kairan-bank-a-main-2
    hostname: bank-a-main-2
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-main-2-data:/data
      - ./.run/proxies/bank-a-main-2.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18103:8080", "127.0.0.1:19103:9090"]


  bank-a-main-3:
    <<: *proxy
    container_name: kairan-bank-a-main-3
    hostname: bank-a-main-3
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-main-3-data:/data
      - ./.run/proxies/bank-a-main-3.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18104:8080", "127.0.0.1:19104:9090"]


  bank-a-main-4:
    <<: *proxy
    container_name: kairan-bank-a-main-4
    hostname: bank-a-main-4
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-main-4-data:/data
      - ./.run/proxies/bank-a-main-4.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18105:8080", "127.0.0.1:19105:9090"]


  bank-a-main-5:
    <<: *proxy
    container_name: kairan-bank-a-main-5
    hostname: bank-a-main-5
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-bank-a: {condition: service_started}
    volumes:
      - bank-a-main-5-data:/data
      - ./.run/proxies/bank-a-main-5.json:/etc/kairan/proxy.json:ro
    networks: [bank-a, cloud]
    ports: ["127.0.0.1:18106:8080", "127.0.0.1:19106:9090"]


  city-b-canary:
    <<: *proxy
    container_name: kairan-city-b-canary
    hostname: city-b-canary
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-city-b: {condition: service_started}
    volumes:
      - city-b-canary-data:/data
      - ./.run/proxies/city-b-canary.json:/etc/kairan/proxy.json:ro
    networks: [city-b, cloud]
    ports: ["127.0.0.1:18107:8080", "127.0.0.1:19107:9090"]


  city-b-main-1:
    <<: *proxy
    container_name: kairan-city-b-main-1
    hostname: city-b-main-1
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-city-b: {condition: service_started}
    volumes:
      - city-b-main-1-data:/data
      - ./.run/proxies/city-b-main-1.json:/etc/kairan/proxy.json:ro
    networks: [city-b, cloud]
    ports: ["127.0.0.1:18108:8080", "127.0.0.1:19108:9090"]


  city-b-main-2:
    <<: *proxy
    container_name: kairan-city-b-main-2
    hostname: city-b-main-2
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-city-b: {condition: service_started}
    volumes:
      - city-b-main-2-data:/data
      - ./.run/proxies/city-b-main-2.json:/etc/kairan/proxy.json:ro
    networks: [city-b, cloud]
    ports: ["127.0.0.1:18109:8080", "127.0.0.1:19109:9090"]


  city-b-main-3:
    <<: *proxy
    container_name: kairan-city-b-main-3
    hostname: city-b-main-3
    depends_on:
      cp: {condition: service_healthy}
      fakemcp-city-b: {condition: service_started}
    volumes:
      - city-b-main-3-data:/data
      - ./.run/proxies/city-b-main-3.json:/etc/kairan/proxy.json:ro
    networks: [city-b, cloud]
    ports: ["127.0.0.1:18110:8080", "127.0.0.1:19110:9090"]


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kairan-prometheus
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: [cloud, bank-a, city-b]
    ports: ["127.0.0.1:19090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    container_name: kairan-grafana
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: ./.run/grafana.env          # GF_SECURITY_ADMIN_PASSWORD, generated at demo time
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # local demo: read-only dashboard without login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/kairan.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    networks: [cloud]
    ports: ["127.0.0.1:13000:3000"]
    depends_on: [prometheus]

  # Admin tool container: demo.sh runs kairanctl here (as the host user, keys stay in ./.run/keys).
  ctl:
    <<: *hardened
    container_name: kairan-ctl
    profiles: ["tools"]
    entrypoint: ["kairanctl"]
    working_dir: /work
    volumes:
      - ./.run:/work
    environment:
      KCTL_CP_URL: http://cp:8080
      KCTL_ADMIN_TOKEN_FILE: /work/admin.token
    networks: [cloud]

networks:
  cloud: {}
  bank-a: {}
  city-b: {}

volumes:
  cp-data: {}
  prom-data: {}
  grafana-data: {}
  bank-a-canary-data: {}
  bank-a-main-1-data: {}
  bank-a-main-2-data: {}
  bank-a-main-3-data: {}
  bank-a-main-4-data: {}
  bank-a-main-5-data: {}
  city-b-canary-data: {}
  city-b-main-1-data: {}
  city-b-main-2-data: {}
  city-b-main-3-data: {}
